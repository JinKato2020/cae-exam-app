<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>4-16 neutral diagram</title><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C82D2D"/></marker></defs><rect width="1000" height="600" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif"><g id="neutral-model">
<!-- 天井 -->
<line x1="120" y1="70" x2="880" y2="70" stroke="#1F3A65" stroke-width="4"/>
<line x1="135" y1="70" x2="117" y2="90" stroke="#888888" stroke-width="2"/><line x1="170" y1="70" x2="152" y2="90" stroke="#888888" stroke-width="2"/><line x1="205" y1="70" x2="187" y2="90" stroke="#888888" stroke-width="2"/><line x1="240" y1="70" x2="222" y2="90" stroke="#888888" stroke-width="2"/><line x1="275" y1="70" x2="257" y2="90" stroke="#888888" stroke-width="2"/><line x1="310" y1="70" x2="292" y2="90" stroke="#888888" stroke-width="2"/><line x1="345" y1="70" x2="327" y2="90" stroke="#888888" stroke-width="2"/><line x1="380" y1="70" x2="362" y2="90" stroke="#888888" stroke-width="2"/><line x1="560" y1="70" x2="542" y2="90" stroke="#888888" stroke-width="2"/><line x1="595" y1="70" x2="577" y2="90" stroke="#888888" stroke-width="2"/><line x1="630" y1="70" x2="612" y2="90" stroke="#888888" stroke-width="2"/><line x1="665" y1="70" x2="647" y2="90" stroke="#888888" stroke-width="2"/><line x1="700" y1="70" x2="682" y2="90" stroke="#888888" stroke-width="2"/>
<!-- ばね k (天井→動滑車P2) -->
<path d="M300,70 L300,100 L278,112 L322,128 L278,144 L322,160 L278,176 L322,192 L278,208 L322,224 L300,236 L300,262" fill="none" stroke="#1F3A65" stroke-width="3"/>
<text x="250" y="175" font-size="27" fill="#1F3A65" text-anchor="middle">k</text>
<!-- 定滑車 P1 (天井に固定) -->
<line x1="645" y1="70" x2="645" y2="150" stroke="#1F3A65" stroke-width="4"/>
<circle cx="645" cy="185" r="34" fill="#E1E7F2" stroke="#1F3A65" stroke-width="4"/><circle cx="645" cy="185" r="5" fill="#1F3A65"/>
<text x="705" y="178" font-size="26" fill="#1F3A65" text-anchor="middle">P1</text>
<text x="702" y="205" font-size="18" fill="#888888" text-anchor="middle">(定滑車)</text>
<!-- 動滑車 P2 -->
<circle cx="300" cy="297" r="34" fill="#E1E7F2" stroke="#1F3A65" stroke-width="4"/><circle cx="300" cy="297" r="5" fill="#1F3A65"/>
<text x="203" y="292" font-size="26" fill="#1F3A65" text-anchor="middle">P2</text>
<text x="205" y="315" font-size="18" fill="#888888" text-anchor="middle">(動滑車)</text>
<!-- 糸: 天井アンカー→P2左→(下を回る)→P2右→P1左→(上を回る)→P1右→質量 -->
<line x1="266" y1="70" x2="266" y2="297" stroke="#1F3A65" stroke-width="2.5"/>
<path d="M266,297 A34,34 0 0 0 334,297" fill="none" stroke="#1F3A65" stroke-width="2.5"/>
<line x1="334" y1="297" x2="611" y2="185" stroke="#1F3A65" stroke-width="2.5"/>
<path d="M611,185 A34,34 0 0 1 679,185" fill="none" stroke="#1F3A65" stroke-width="2.5"/>
<line x1="679" y1="185" x2="679" y2="392" stroke="#1F3A65" stroke-width="2.5"/>
<!-- 質量 m (糸の自由端) -->
<rect x="634" y="392" width="92" height="78" rx="4" fill="#E1E7F2" stroke="#1F3A65" stroke-width="4"/>
<text x="680" y="443" font-size="34" fill="#1F3A65" text-anchor="middle">m</text>
<!-- 変位 x (P2・下向き) と z (質量・下向き) -->
<line x1="372" y1="285" x2="372" y2="345" stroke="#C82D2D" stroke-width="3" marker-end="url(#red)"/>
<text x="392" y="322" font-size="26" fill="#C82D2D" text-anchor="middle">x</text>
<line x1="760" y1="400" x2="760" y2="470" stroke="#C82D2D" stroke-width="3" marker-end="url(#red)"/>
<text x="780" y="442" font-size="26" fill="#C82D2D" text-anchor="middle">z</text>
<text x="500" y="560" font-size="25" fill="#888888" text-anchor="middle">拘束: z = 2x</text>
</g><g id="answer-overlay"/></g></svg>
