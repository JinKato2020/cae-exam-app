<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>10-6: neutral problem diagram</title><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F3A65"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C82D2D"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#888888"/></marker></defs><rect width="1000" height="600" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif"><g id="problem-number"><text x="35" y="45" font-size="24" fill="#888888">10-6</text></g><g id="neutral-model"><text x="500" y="280" font-size="38" fill="#1F3A65" text-anchor="middle">f = (1 / 2π) √(k / m)</text><line x1="460" y1="310" x2="275" y2="395" stroke="#888888" stroke-width="3" marker-end="url(#gray)"/><line x1="600" y1="310" x2="735" y2="395" stroke="#888888" stroke-width="3" marker-end="url(#gray)"/><rect x="120" y="420" width="300" height="100" rx="5" fill="white" stroke="#888888" stroke-width="3"/><rect x="580" y="420" width="300" height="100" rx="5" fill="white" stroke="#888888" stroke-width="3"/><text x="270" y="392" font-size="28" fill="#1F3A65" text-anchor="middle">k</text><text x="730" y="392" font-size="28" fill="#1F3A65" text-anchor="middle">m</text></g><g id="answer-overlay"><text x="270" y="440" font-size="14" fill="#1F3A65" text-anchor="middle" font-weight="bold" font-family="sans-serif">剛性 k 増 → f 上昇</text><text x="730" y="440" font-size="14" fill="#C82D2D" text-anchor="middle" font-weight="bold" font-family="sans-serif">質量 m 増 → f 低下</text></g></g></svg>