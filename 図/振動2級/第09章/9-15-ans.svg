<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>9-15: neutral problem diagram</title><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F3A65"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C82D2D"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#888888"/></marker></defs><rect width="1000" height="600" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif"><g id="problem-number"><text x="35" y="45" font-size="24" fill="#888888">9-15</text></g><g id="neutral-model"><rect x="80" y="125" width="300" height="90" rx="5" fill="white" stroke="#888888" stroke-width="3"/><text x="230.0" y="178.0" font-size="24" fill="#1F3A65" text-anchor="middle">現在ステップ</text><rect x="80" y="350" width="300" height="90" rx="5" fill="white" stroke="#888888" stroke-width="3"/><text x="230.0" y="403.0" font-size="24" fill="#1F3A65" text-anchor="middle">入力</text><rect x="680" y="235" width="250" height="105" rx="5" fill="white" stroke="#888888" stroke-width="3"/><text x="805.0" y="295.5" font-size="24" fill="#1F3A65" text-anchor="middle">次ステップ</text><line x1="380" y1="170" x2="540" y2="285" stroke="#888888" stroke-width="3" marker-end="url(#gray)"/><line x1="380" y1="395" x2="540" y2="285" stroke="#888888" stroke-width="3" marker-end="url(#gray)"/><rect x="545" y="240" width="95" height="90" rx="5" fill="white" stroke="#888888" stroke-width="3"/><line x1="642" y1="285" x2="673" y2="285" stroke="#888888" stroke-width="3" marker-end="url(#gray)"/><text x="230" y="260" font-size="30" fill="#1F3A65" text-anchor="middle">tₙ</text><text x="805" y="410" font-size="30" fill="#1F3A65" text-anchor="middle">tₙ