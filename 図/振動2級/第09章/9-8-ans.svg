<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>9-8: neutral problem diagram</title><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F3A65"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C82D2D"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#888888"/></marker></defs><rect width="1000" height="600" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif"><g id="problem-number"><text x="35" y="45" font-size="24" fill="#888888">9-8</text></g><g id="neutral-model"><rect x="70" y="220" width="260" height="100" rx="5" fill="white" stroke="#888888" stroke-width="3"/><text x="200.0" y="278.0" font-size="24" fill="#1F3A65" text-anchor="middle">初期ベクトル</text><rect x="370" y="220" width="260" height="100" rx="5" fill="white" stroke="#888888" stroke-width="3"/><text x="500.0" y="278.0" font-size="24" fill="#1F3A65" text-anchor="middle">行列Aを掛ける</text><rect x="670" y="220" width="260" height="100" rx="5" fill="white" stroke="#888888" stroke-width="3"/><text x="800.0" y="278.0" font-size="24" fill="#1F3A65" text-anchor="middle">正規化する</text><line x1="335" y1="270" x2="360" y2="270" stroke="#888888" stroke-width="3" marker-end="url(#gray)"/><line x1="635" y1="270" x2="660" y2="270" stroke="#888888" stroke-width="3" marker-end="url(#gray)"/><path d="M 800.00,330.00 L 800.00,440.00 L 200.00,440.00 L 200.00,340.00" fill="none" stroke="#888888" stroke-width="2" stroke-linejoin="round"/><line x1="200" y1="370" x2="200" y2="335" stroke="#888888" stroke-width="3" marker-end="url(#gray)"/><text x="500" y="485" font-size="27" fill="#888888" text-anchor="middle">繰り返す</text></g><g id="answer-overlay"><rect x="220" y="540" width="560" height="56" fill="#E1E7F2" stroke="#1F3A65" stroke-width="1.6" opacity="0.95" rx="8"/><text x="500" y="564" font-size="14" fill="#1F3A65" text-anchor="middle" font-weight="bold" font-family="sans-serif">反復のたびに 最大固有値 の固有ベクトル方向へ収束</text><text x="500" y="586" font-size="14" fill="#C82D2D" text-anchor="middle" font-weight="bold" font-family="sans-serif">→ べき乗法(反復乗算法)</text></g></g></svg>