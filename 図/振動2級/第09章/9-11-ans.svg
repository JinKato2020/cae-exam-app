ans-serif">−K</text><text x="845" y="340" font-size="20" fill="#C82D2D" text-anchor="middle" font-weight="bold" font-family="sans-serif">−C</text><text x="640" y="165" font-size="15" fill="#1F3A65" text-anchor="end" font-weight="normal" font-family="sans-serif">[A] =</text><text x="500" y="470" font-size="13" fill="#1F3A65" text-anchor="middle" font-weight="bold" font-family="sans-serif">状態ベクトル z={x; ẋ} で1階化 → [A]z = λ[B]z,  [B]=diag(I, M)</text></g></g></svg>