<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>4-33: neutral problem diagram</title><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F3A65"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C82D2D"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#888888"/></marker></defs><rect width="1000" height="600" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif"><g id="problem-number"><text x="35" y="45" font-size="24" fill="#888888">4-33</text></g><g id="neutral-model"><rect x="160" y="270" width="130" height="110" rx="0" fill="#E1E7F2" stroke="#1F3A65" stroke-width="3"/><rect x="370" y="270" width="130" height="110" rx="0" fill="#E1E7F2" stroke="#1F3A65" stroke-width="3"/><line x1="170" y1="240" x2="265" y2="240" stroke="#1F3A65" stroke-width="3" marker-end="url(#navy)"/><text x="215" y="215" font-size="25" fill="#1F3A65" text-anchor="middle">a</text><line x1="380" y1="240" x2="475" y2="240" stroke="#1F3A65" stroke-width="3" marker-end="url(#navy)"/><text x="425" y="215" font-size="25" fill="#1F3A65" text-anchor="middle">a</text><text x="330" y="445" font-size="25" fill="#1F3A65" text-anchor="middle">モード形: {a, a}</text><line x1="550" y1="325" x2="650" y2="325" stroke="#888888" stroke-width="3" marker-end="url(#gray)"/><rect x="690" y="185" width="245" height="280" rx="8" fill="white" stroke="#888888" stroke-width="3"/><text x="812" y="140" font-size="25" fill="#1F3A65" text-anchor="middle">正規化</text><text x="812" y="510" font-size="21" fill="#888888" text-anchor="middle">振幅の基準</text></g><g id="answer-overlay"><rect x="675" y="180" width="265" height="300" fill="#E1E7F2" stroke="#1F3A65" stroke-width="1.6" opacity="0.95" rx="8"/><text x="807" y="212" font-size="15" fill="#C82D2D" text-anchor="middle" font-weight="bold" font-family="sans-serif">正規化の3通り (モード{a,a})</text><text x="807" y="262.5" font-size="14" fill="#1F3A65" text-anchor="middle" font-weight="normal" font-family="sans-serif">① 最大成分 = 1</text><text x="807" y="289.5" font-size="14" fill="#1F3A65" text-anchor="middle" font-weight="normal" font-family="sans-serif">    → a = 1</text><text x="807" y="316.5" font-size="14" fill="#1F3A65" text-anchor="middle" font-weight="normal" font-family="sans-serif">② ベクトルノルム = 1</text><text x="807" y="343.5" font-size="14" fill="#1F3A65" text-anchor="middle" font-weight="normal" font-family="sans-serif">    → a = 1/√2</text><text x="807" y="370.5" font-size="14" fill="#1F3A65" text-anchor="middle" font-weight="normal" font-family="sans-serif">③ 質量正規化 φᵀMφ = 1</text><text x="807" y="397.5" font-size="14" fill="#1F3A65" text-anchor="middle" font-weight="normal" font-family="sans-serif">    → a = 1/√(2m)</text></g></g></svg>