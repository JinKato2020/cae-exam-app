<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">参照径と自然径</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">5-26  </text><text x="104.70" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">参照径と自然径</text><rect x="130" y="155" width="260" height="260" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><circle cx="260" cy="285" r="83" fill="white" stroke="#1F3A65" stroke-width="3"/><circle cx="690" cy="285" r="84" fill="#1F3A65"/><line x1="175" y1="285" x2="345" y2="285" stroke="#888" stroke-width="2.5"/><text x="240.00" y="270" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">D</text><text x="140.00" y="465" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">穴の参照径</text><text x="240.00" y="465" font-family="DejaVu Sans" font-size="20" fill="#1F3A65"> D=200 mm</text><text x="540.00" y="440" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">軸の自然径</text><text x="640.00" y="440" font-family="DejaVu Sans" font-size="20" fill="#1F3A65"> D+δ</text><text x="550.00" y="475" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">δ=0.10 mm</text><text x="135.00" y="115" font-family="Noto Sans CJK JP" font-size="20" fill="#C82D2D">穴材：</text><text x="195.00" y="115" font-family="DejaVu Sans" font-size="20" fill="#C82D2D">ε₀=0</text><text x="555.00" y="115" font-family="Noto Sans CJK JP" font-size="20" fill="#C82D2D">軸：</text><text x="595.00" y="115" font-family="DejaVu Sans" font-size="20" fill="#C82D2D">ε₀x=ε₀y=δ/D</text><text x="209.59" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">軸だけに</text><text x="293.59" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> +5×10⁻⁴ </text><text x="401.70" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">を与える</text><text x="485.07" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="491.74" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">／</text><text x="512.74" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="519.41" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">穴に反対符号を重ねない</text></svg>