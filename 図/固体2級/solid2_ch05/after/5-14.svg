<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">非零指定変位の消去</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">5-14  </text><text x="104.70" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">非零指定変位の消去</text><text x="115.00" y="170" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">既知：</text><text x="175.00" y="170" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">uc=ūc</text><text x="115.00" y="245" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">自由方程式：</text><text x="235.00" y="245" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">Kff uf + Kfc ūc = ff</text><line x1="330" y1="280" x2="330" y2="330" stroke="#888" stroke-width="2.5" marker-end="url(#gray)"/><text x="115.00" y="390" font-family="DejaVu Sans" font-size="32" fill="#C82D2D">Kff uf = ff − Kfc ūc</text><text x="259.50" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">非零指定変位は自由方程式の右辺にも寄与する</text></svg>