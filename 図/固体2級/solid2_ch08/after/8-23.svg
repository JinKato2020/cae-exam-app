<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">断面回転と軸方向変位</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">8-23  </text><text x="104.70" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">断面回転と軸方向変位</text><text x="155.00" y="160" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">w = w̄(x)</text><text x="244.64" y="160" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">、</text><text x="264.64" y="160" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">v = 0</text><text x="155.00" y="235" font-family="DejaVu Sans" font-size="30" fill="#C82D2D">u = −z w̄′(x)</text><text x="155.00" y="325" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">γxz = u,z + w,x</text><text x="155.00" y="390" font-family="DejaVu Sans" font-size="20" fill="#C82D2D">= −w̄′ + w̄′ = 0</text><text x="252.83" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">断面は軸線に垂直</text><text x="420.83" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="427.50" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">／</text><text x="448.50" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="455.17" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">せん断変形を無視する仮定</text></svg>