<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">平面応力係数の特定</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">8-20  </text><text x="104.70" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">平面応力係数の特定</text><text x="145.00" y="165" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">C (1−ν)/2 = G</text><text x="145.00" y="240" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">G = E / [2(1+ν)]</text><line x1="325" y1="275" x2="325" y2="335" stroke="#888" stroke-width="2.5" marker-end="url(#gray)"/><text x="145.00" y="405" font-family="DejaVu Sans" font-size="34" fill="#C82D2D">C = E / (1−ν²)</text><text x="247.87" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">工学せん断ひずみ</text><text x="415.87" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D">γxy</text><text x="453.13" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">を用いる</text><text x="537.13" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="543.80" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">／</text><text x="564.80" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> C</text><text x="586.13" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">の単位は応力</text></svg>