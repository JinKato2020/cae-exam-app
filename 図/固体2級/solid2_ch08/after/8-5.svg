<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">局所モデルへの境界受渡し</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">8-5  </text><text x="89.44" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">局所モデルへの境界受渡し</text><rect x="100" y="175" width="320" height="180" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><rect x="265" y="235" width="55" height="65" fill="white" stroke="#1F3A65" stroke-width="2.5"/><text x="145.00" y="140" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">全体モデル</text><text x="115.00" y="415" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">全体変形・温度を確認</text><line x1="445" y1="265" x2="535" y2="265" stroke="#888" stroke-width="2.5" marker-end="url(#gray)"/><rect x="560" y="175" width="280" height="180" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><text x="615.00" y="140" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">局所ソリッド</text><text x="600.00" y="245" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">有限フィレット</text><text x="590.00" y="300" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">着目部を細分</text><text x="565.00" y="415" font-family="Noto Sans CJK JP" font-size="20" fill="#C82D2D">切断境界へ変位を補間</text><text x="200.64" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">切断面を無条件に全固定しない</text><text x="494.64" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="501.31" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">／</text><text x="522.31" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="528.98" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">境界を離して感度を確認</text></svg>