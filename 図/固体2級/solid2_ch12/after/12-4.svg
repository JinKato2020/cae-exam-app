<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">4桁で丸めた演算</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">12-4  4</text><text x="119.97" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">桁で丸めた演算</text><text x="115.00" y="130" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">1234+1.987 </text><text x="246.23" y="130" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">の正確値：</text><text x="346.23" y="130" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">1235.987</text><text x="115.00" y="210" font-family="DejaVu Sans" font-size="20" fill="#C82D2D">4</text><text x="127.72" y="210" font-family="Noto Sans CJK JP" font-size="20" fill="#C82D2D">桁へ丸め：</text><text x="227.72" y="210" font-family="DejaVu Sans" font-size="20" fill="#C82D2D">1236</text><text x="115.00" y="290" font-family="DejaVu Sans" font-size="20" fill="#C82D2D">1236−1233=3.000</text><text x="115.00" y="370" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">正確な式の値：</text><text x="255.00" y="370" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">2.987</text><text x="115.00" y="445" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">差：</text><text x="155.00" y="445" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">0.013 </text><text x="218.59" y="445" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">／</text><text x="238.59" y="445" font-family="DejaVu Sans" font-size="20" fill="#1F3A65"> </text><text x="244.95" y="445" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">結果の相対誤差：約</text><text x="424.95" y="445" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">0.435%</text><text x="228.31" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">減算はここでは正確でも、先の丸め誤差が結果に残る</text></svg>