<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">整数演算の途中結果</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">12-3  </text><text x="104.70" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">整数演算の途中結果</text><text x="125.00" y="145" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">整数の</text><text x="185.00" y="145" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">1÷2</text><text x="227.20" y="145" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">は</text><text x="247.20" y="145" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">0</text><text x="125.00" y="230" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">1+(1÷2−1)×2+1÷2</text><text x="125.00" y="310" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">=1+(0−1)×2+0</text><text x="125.00" y="395" font-family="DejaVu Sans" font-size="28" fill="#C82D2D">=−1</text><text x="252.83" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">各除算を整数型で評価</text><text x="462.83" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="469.50" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">／</text><text x="490.50" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="497.17" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">実数演算と混同しない</text></svg>