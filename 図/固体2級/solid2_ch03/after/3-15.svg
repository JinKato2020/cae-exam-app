<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">円筒の抵抗は面積を含めて比較</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">3-15  </text><text x="104.70" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">円筒の抵抗は面積を含めて比較</text><circle cx="260" cy="260" r="126" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><circle cx="260" cy="260" r="105" fill="white" stroke="#1F3A65" stroke-width="2.5"/><text x="190.00" y="245" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">内側流体</text><text x="185.00" y="280" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">h₁ = 100</text><text x="120.00" y="420" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">r₁ = 0.05 m</text><text x="236.08" y="420" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">、</text><text x="256.08" y="420" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">r₂ = 0.06 m</text><text x="535.00" y="190" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">外側：</text><text x="595.00" y="190" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">h₂ = 5 W/(m² K)</text><text x="535.00" y="240" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">壁：</text><text x="575.00" y="240" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">λ = 10 W/(m K)</text><text x="535.00" y="290" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">管長：</text><text x="595.00" y="290" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">L = 1 m</text><text x="535.00" y="350" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">R₁ = 0.03183 K/W</text><text x="535.00" y="390" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">Rw = 0.002902 K/W</text><text x="535.00" y="430" font-family="DejaVu Sans" font-size="20" fill="#C82D2D">R₂ = 0.53052 K/W</text><text x="254.53" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">最大抵抗は外側対流</text><text x="443.53" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> → </text><text x="474.47" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">そこでの温度低下が最大</text></svg>