<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">xy の純せん断を三次元で表す</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">2-19  xy </text><text x="140.73" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">の純せん断を三次元で表す</text><rect x="165" y="185" width="150" height="150" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><line x1="315" y1="250" x2="315" y2="200" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="165" y1="250" x2="165" y2="310" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="215" y1="185" x2="285" y2="185" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="265" y1="335" x2="195" y2="335" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><text x="120.00" y="390" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">xy </text><text x="150.05" y="390" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">面内：</text><text x="210.05" y="390" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">τ = 40 MPa</text><text x="460.00" y="190" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">σx = σy = σz = 0</text><text x="460.00" y="240" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">τxy = τyx = 40 MPa</text><text x="460.00" y="290" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">τyz = τzy = τzx = τxz = 0</text><text x="239.12" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">一組のせん断を、三次元の応力状態として考える。</text></svg>