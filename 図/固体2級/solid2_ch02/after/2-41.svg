<text x="320" y="322" fill="#1F3A65" font-family="Noto Sans CJK JP,sans-serif" font-size="18" text-anchor="middle" id="text_28">E = 200GPa　　α = 12×10⁻⁶/K</text>
<!-- Claude回答後 注記 -->
<text x="320" y="24" fill="#C82D2D" font-family="Noto Sans CJK JP,sans-serif" font-size="14" text-anchor="middle">自由なら左半分が δth = αΔT(L/2) 伸び、両端固定で全長の伸び = 0</text>
<text x="320" y="47" fill="#C82D2D" font-family="Noto Sans CJK JP,sans-serif" font-size="14" text-anchor="middle">αΔT(L/2) + NL/(EA) = 0  →  σT = N/A = −EαΔT/2 ≈ −120MPa（圧縮）</text>
