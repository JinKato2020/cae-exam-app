<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">2-31 静水圧成分とミーゼス相当応力</title><rect width="960" height="560" fill="white"/><defs><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F3A65"><text x="35" y="42">2-31 静水圧成分とミーゼス相当応力</text><text x="70" y="105" fill="#1F3A65" font-size="25">三つの主応力に同じ成分 p を加える</text><text x="90" y="170" fill="#1F3A65" font-size="22">σ1′ = σ1 + p</text><line x1="300" y1="162" x2="470" y2="162" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><text x="520" y="170" fill="#1F3A65" font-size="22">σ1′ − σ2′ = σ1 − σ2</text><text x="90" y="240" fill="#1F3A65" font-size="22">σ2′ = σ2 + p</text><line x1="300" y1="232" x2="470" y2="232" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><text x="520" y="240" fill="#1F3A65" font-size="22">σ2′ − σ3′ = σ2 − σ3</text><text x="90" y="310" fill="#1F3A65" font-size="22">σ3′ = σ3 + p</text><line x1="300" y1="302" x2="470" y2="302" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><text x="520" y="310" fill="#1F3A65" font-size="22">σ3′ − σ1′ = σ3 − σ1</text><text x="80" y="390" fill="#1F3A65" font-size="23">σeq² = [(σ1 − σ2)² + (σ2 − σ3)² + (σ3 − σ1)²] / 2</text><text x="80" y="440" fill="#C82D2D" font-size="22">共通成分を加えても主応力差は変わらず、ミーゼス相当応力は不変。</text><text x="80" y="490" fill="#1F3A65" font-size="23">静水圧状態：σ1 = σ2 = σ3 = p  →  σeq = 0</text><text x="80" y="530" fill="#888" font-size="18">p は引張りを正とする共通応力成分。静水圧軸は三主応力空間の (1,1,1) 方向。</text></g></svg>