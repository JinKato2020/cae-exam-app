<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">2-32 ミーゼス相当応力の計算</title><rect width="960" height="560" fill="white"/><defs><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F3A65"><text x="35" y="42">2-32 ミーゼス相当応力の計算</text><rect x="130" y="165" width="150" height="150" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><line x1="130" y1="240" x2="65" y2="240" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="280" y1="240" x2="345" y2="240" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="205" y1="100" x2="205" y2="160" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="205" y1="380" x2="205" y2="320" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="280" y1="280" x2="280" y2="170" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="130" y1="170" x2="130" y2="280" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="155" y1="165" x2="260" y2="165" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="260" y1="315" x2="155" y2="315" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><text x="55" y="425" fill="#C82D2D" font-size="20">σx = 100 MPa</text><text x="60" y="90" fill="#C82D2D" font-size="20">σy = −50 MPa</text><text x="315" y="180" fill="#C82D2D" font-size="20">τxy = 40 MPa</text><text x="485" y="155" fill="#1F3A65" font-size="21">σeq² = σx² − σxσy + σy² + 3τxy²</text><text x="485" y="210" fill="#1F3A65" font-size="21">= 10000 + 5000 + 2500 + 4800</text><text x="485" y="265" fill="#1F3A65" font-size="23">= 22300 MPa²</text><text x="485" y="335" fill="#C82D2D" font-size="23">σeq = √22300 ≈ 149.3 MPa</text><text x="485" y="395" fill="#1F3A65" font-size="22">149.3 MPa ＜ σY = 200 MPa</text><text x="485" y="450" fill="#C82D2D" font-size="25">降伏しない（正解①）</text><text x="65" y="520" fill="#888" font-size="19">平面応力：σz = τxz = τyz = 0。法線応力は引張りを正とする。</text></g></svg>