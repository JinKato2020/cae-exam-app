<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">斜めばねの自由度</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">4-23  </text><text x="104.70" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">斜めばねの自由度</text><line x1="230" y1="420" x2="700" y2="420" stroke="#888" stroke-width="1.2" marker-end="url(#gray)"/><line x1="230" y1="420" x2="230" y2="130" stroke="#888" stroke-width="1.2" marker-end="url(#gray)"/><text x="710.00" y="425" font-family="DejaVu Sans" font-size="20" fill="#888">x</text><text x="220.00" y="118" font-family="DejaVu Sans" font-size="20" fill="#888">y</text><polyline points="230.00,420.00 260.00,368.00 267.00,335.00 294.00,340.00 294.00,288.00 321.00,294.00 321.00,243.00 348.00,249.00 370.00,178.00" fill="none" stroke="#1F3A65" stroke-width="2.5"/><circle cx="230" cy="420" r="5" fill="#1F3A65"/><circle cx="370" cy="178" r="5" fill="#1F3A65"/><text x="160.00" y="450" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">節点</text><text x="200.00" y="450" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">1</text><text x="395.00" y="175" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">節点</text><text x="435.00" y="175" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">2</text><text x="400.00" y="300" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">θ=60°</text><text x="510.00" y="205" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">k=120 N/mm</text><text x="500.00" y="260" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">順序：</text><text x="560.00" y="260" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">[u₁,v₁,u₂,v₂]</text><text x="485.00" y="340" font-family="DejaVu Sans" font-size="20" fill="#C82D2D">K₁₂ = k cosθ sinθ</text><text x="485.00" y="390" font-family="DejaVu Sans" font-size="20" fill="#C82D2D">=51.96 ≈ 52.0 N/mm</text><text x="224.94" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">同じ端の</text><text x="308.94" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> x−y </text><text x="364.72" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">成分</text><text x="406.72" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="413.39" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">／</text><text x="434.39" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="441.06" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">反対端のブロックでは符号が逆</text></svg>