<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">契約で指定した利用範囲</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">13-3  </text><text x="104.70" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">契約で指定した利用範囲</text><rect x="100" y="170" width="265" height="150" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><rect x="595" y="170" width="265" height="150" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><text x="135.00" y="225" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">指定された</text><text x="235.00" y="225" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">PC</text><text x="130.00" y="275" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">契約で利用を許可</text><text x="625.00" y="225" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">指定外の</text><text x="705.00" y="225" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">PC</text><text x="620.00" y="275" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">一時利用も許可なし</text><line x1="375" y1="245" x2="585" y2="245" stroke="#888" stroke-width="2.5" marker-end="url(#gray)"/><line x1="450" y1="220" x2="505" y2="275" stroke="#C82D2D" stroke-width="4"/><line x1="505" y1="220" x2="450" y2="275" stroke="#C82D2D" stroke-width="4"/><text x="145.09" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">バックアップ作成の許可と、別</text><text x="438.25" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D">PC</text><text x="465.56" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">での使用許可は別</text><text x="633.56" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="640.23" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">／</text><text x="661.23" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="667.91" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">本問の契約条件</text></svg>