<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">2-29 固定端反力と反力モーメント</title><rect width="960" height="560" fill="white"/><defs><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker></defs><g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F3A65"><text x="35" y="42">2-29 固定端反力と反力モーメント</text><rect x="130" y="255" width="650" height="16" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><line x1="780" y1="210" x2="810" y2="190" stroke="#1F3A65" stroke-width="2.5"/><line x1="780" y1="230" x2="810" y2="210" stroke="#1F3A65" stroke-width="2.5"/><line x1="780" y1="250" x2="810" y2="230" stroke="#1F3A65" stroke-width="2.5"/><line x1="780" y1="270" x2="810" y2="250" stroke="#1F3A65" stroke-width="2.5"/><line x1="780" y1="290" x2="810" y2="270" stroke="#1F3A65" stroke-width="2.5"/><line x1="780" y1="310" x2="810" y2="290" stroke="#1F3A65" stroke-width="2.5"/><line x1="780" y1="330" x2="810" y2="310" stroke="#1F3A65" stroke-width="2.5"/><line x1="780" y1="200" x2="780" y2="330" stroke="#1F3A65" stroke-width="2.5"/><line x1="180" y1="170" x2="180" y2="250" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="240" y1="170" x2="240" y2="250" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="300" y1="170" x2="300" y2="250" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="360" y1="170" x2="360" y2="250" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="420" y1="170" x2="420" y2="250" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="480" y1="170" x2="480" y2="250" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="540" y1="170" x2="540" y2="250" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="600" y1="170" x2="600" y2="250" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="660" y1="170" x2="660" y2="250" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="720" y1="170" x2="720" y2="250" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><line x1="130" y1="140" x2="130" y2="250" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><text x="60" y="125" fill="#C82D2D" font-size="22">P = 5 kN</text><text x="370" y="135" fill="#C82D2D" font-size="22">w = 2 kN/m</text><line x1="780" y1="365" x2="780" y2="280" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><text x="800" y="350" fill="#C82D2D" font-size="20">R_D = 9 kN</text><path d="M780 90 C840 90 840 160 780 160" fill="none" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><text x="670" y="75" fill="#C82D2D" font-size="20">M_D = 14 kN m</text><text x="805" y="190" fill="#C82D2D" font-size="19">時計回り</text><line x1="130" y1="315" x2="780" y2="315" stroke="#888" stroke-width="2.5"/><text x="390" y="350" fill="#888" font-size="22">L = 2 m</text><text x="90" y="420" fill="#1F3A65" font-size="22">R_D = P + wL = 5 + 2 × 2 = 9 kN</text><text x="90" y="465" fill="#1F3A65" font-size="22">|M_D| = PL + wL²/2 = 10 + 4 = 14 kN m</text><text x="90" y="515" fill="#888" font-size="19">外力の反時計回りのモーメントと、固定端の時計回り反力が釣り合う。</text></g></svg>