<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">共有メモリと分散メモリの例</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">12-30  </text><text x="119.97" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">共有メモリと分散メモリの例</text><text x="105.00" y="125" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">OpenMP</text><text x="187.75" y="125" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">の典型例</text><text x="590.00" y="125" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">MPI</text><text x="625.22" y="125" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">の典型例</text><rect x="120" y="180" width="110" height="70" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><text x="145.00" y="224" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">スレッド</text><line x1="175" y1="260" x2="175" y2="320" stroke="#888" stroke-width="2.5" marker-end="url(#gray)"/><rect x="270" y="180" width="110" height="70" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><text x="295.00" y="224" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">スレッド</text><line x1="325" y1="260" x2="325" y2="320" stroke="#888" stroke-width="2.5" marker-end="url(#gray)"/><rect x="115" y="330" width="280" height="105" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><text x="160.00" y="390" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">共有メモリ</text><rect x="565" y="175" width="160" height="100" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><text x="580.00" y="215" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">プロセス</text><text x="580.00" y="250" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">各メモリ</text><rect x="760" y="175" width="160" height="100" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><text x="775.00" y="215" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">プロセス</text><text x="775.00" y="250" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">各メモリ</text><line x1="735" y1="215" x2="750" y2="215" stroke="#888" stroke-width="2.5" marker-end="url(#gray)"/><line x1="750" y1="240" x2="735" y2="240" stroke="#888" stroke-width="2.5" marker-end="url(#gray)"/><text x="575.00" y="375" font-family="Noto Sans CJK JP" font-size="20" fill="#C82D2D">プロセス間の通信</text><text x="170.32" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D">MPI</text><text x="207.29" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">は共有メモリの計算機でも使える</text><text x="521.66" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> </text><text x="528.34" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">／</text><text x="549.34" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D"> OpenMP</text><text x="642.88" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">との併用も可能</text></svg>