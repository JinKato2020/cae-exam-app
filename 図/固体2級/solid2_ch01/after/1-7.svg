<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">境界条件と時間に関する条件</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">1-7  </text><text x="89.44" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">境界条件と時間に関する条件</text><rect x="125" y="195" width="470" height="40" fill="#E1E7F2" stroke="#1F3A65" stroke-width="2.5"/><line x1="125" y1="140" x2="125" y2="285" stroke="#1F3A65" stroke-width="2.5"/><line x1="125" y1="155" x2="105" y2="171" stroke="#888" stroke-width="1.2"/><line x1="125" y1="175" x2="105" y2="191" stroke="#888" stroke-width="1.2"/><line x1="125" y1="195" x2="105" y2="211" stroke="#888" stroke-width="1.2"/><line x1="125" y1="215" x2="105" y2="231" stroke="#888" stroke-width="1.2"/><line x1="125" y1="235" x2="105" y2="251" stroke="#888" stroke-width="1.2"/><line x1="125" y1="255" x2="105" y2="271" stroke="#888" stroke-width="1.2"/><line x1="125" y1="275" x2="105" y2="291" stroke="#888" stroke-width="1.2"/><line x1="595" y1="215" x2="700" y2="215" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><text x="75.00" y="125" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">固定端</text><text x="670.00" y="180" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">荷重</text><text x="155.00" y="290" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">形状・材料と、境界の条件を設定</text><rect x="70" y="340" width="390" height="130" fill="white" stroke="#1F3A65" stroke-width="2.5"/><text x="95.00" y="375" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">静的解析</text><text x="95.00" y="410" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">K u = F</text><text x="95.00" y="445" font-family="Noto Sans CJK JP" font-size="18" fill="#1F3A65">剛体運動を除く拘束</text><text x="257.00" y="445" font-family="DejaVu Sans" font-size="18" fill="#1F3A65"> → </text><text x="283.52" y="445" font-family="Noto Sans CJK JP" font-size="18" fill="#1F3A65">一意解</text><rect x="500" y="340" width="390" height="130" fill="white" stroke="#1F3A65" stroke-width="2.5"/><text x="525.00" y="375" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">時間積分による動解析</text><text x="525.00" y="410" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">M ü + C u̇ + K u = F(t)</text><text x="525.00" y="445" font-family="Noto Sans CJK JP" font-size="18" fill="#1F3A65">初期変位・初期速度も設定</text><text x="249.42" y="525" font-family="Noto Sans CJK JP" font-size="21" fill="#C82D2D">自由物体の動解析まで、変位拘束必須とはしない</text></svg>