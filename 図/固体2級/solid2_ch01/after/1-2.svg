37.72" y="130" font-family="Noto Sans CJK JP" font-size="20" fill="#1F3A65">倍</text><line x1="260" y1="285" x2="380" y2="285" stroke="#C82D2D" stroke-width="2.5" marker-end="url(#red)"/><text x="665.00" y="210" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">2 × 2 × 2 = 8</text><text x="665.00" y="255" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">det(2A) = 8 det A</text><text x="665.00" y="300" font-family="DejaVu Sans" font-size="20" fill="#C82D2D">= 8 × 4 = 32</text><text x="170.00" y="437" font-family="DejaVu Sans" font-size="26" fill="#1F3A65">AA⁻¹ = I  ⇒  det A · det(A⁻¹) = 1</text><text x="405.27" y="525" font-family="DejaVu Sans" font-size="21" fill="#C82D2D">det(A⁻¹) = 1/4</text></svg>