<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title"><title id="title">右辺の整合性と解の個数</title><rect width="960" height="560" fill="white"/><defs><marker id="nav" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F3A65"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C82D2D"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888"/></marker></defs><text x="35.00" y="42" font-family="DejaVu Sans" font-size="24" fill="#1F3A65">1-1  </text><text x="89.44" y="42" font-family="Noto Sans CJK JP" font-size="24" fill="#1F3A65">右辺の整合性と解の個数</text><line x1="95" y1="410" x2="390" y2="410" stroke="#888" stroke-width="1.2" marker-end="url(#gray)"/><line x1="95" y1="410" x2="95" y2="165" stroke="#888" stroke-width="1.2" marker-end="url(#gray)"/><text x="400.00" y="415" font-family="DejaVu Sans" font-size="20" fill="#888">x₁</text><text x="85.00" y="153" font-family="DejaVu Sans" font-size="20" fill="#888">x₂</text><line x1="95" y1="230" x2="365" y2="410" stroke="#1F3A65" stroke-width="2.5"/><line x1="95" y1="230" x2="365" y2="410" stroke="#C82D2D" stroke-width="2.5" stroke-dasharray="5 4"/><text x="110.00" y="165" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">x₁ + 2x₂ = 3</text><text x="110.00" y="195" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">2x₁ + 4x₂ = 6</text><text x="135.00" y="463" font-family="DejaVu Sans" font-size="20" fill="#C82D2D">2</text><text x="147.72" y="463" font-family="Noto Sans CJK JP" font-size="20" fill="#C82D2D">式が重なる：無数の解</text><line x1="555" y1="410" x2="850" y2="410" stroke="#888" stroke-width="1.2" marker-end="url(#gray)"/><line x1="555" y1="410" x2="555" y2="165" stroke="#888" stroke-width="1.2" marker-end="url(#gray)"/><text x="860.00" y="415" font-family="DejaVu Sans" font-size="20" fill="#888">x₁</text><text x="545.00" y="153" font-family="DejaVu Sans" font-size="20" fill="#888">x₂</text><line x1="555" y1="230" x2="825" y2="410" stroke="#1F3A65" stroke-width="2.5"/><line x1="555" y1="200" x2="870" y2="410" stroke="#C82D2D" stroke-width="2.5"/><text x="565.00" y="145" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">2x₁ + 4x₂ = 7</text><text x="565.00" y="178" font-family="DejaVu Sans" font-size="20" fill="#1F3A65">x₁ + 2x₂ = 3</text><text x="575.00" y="463" font-family="Noto Sans CJK JP" font-size="20" fill="#C82D2D">平行で交点なし：解なし</text></svg>